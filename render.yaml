services:
  # ========================================================
  # 🌐 FRONTEND (React 19 + Vite Static Site)
  # ========================================================
  - type: web
    name: owg-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://owg-games-master.onrender.com/api/v1
      - key: VITE_AUTH_API_BASE_URL
        value: https://owg-user-management.onrender.com/api/v1/auth
      - key: VITE_TTT_API_BASE_URL
        value: https://owg-tic-tac-toe.onrender.com/api/v1/tictactoe
      - key: VITE_TTT_WS_URL
        value: https://owg-tic-tac-toe.onrender.com/ws/tictactoe
      - key: VITE_LUDO_API_BASE_URL
        value: https://owg-ludo.onrender.com/api/v1/ludo
      - key: VITE_LUDO_WS_URL
        value: https://owg-ludo.onrender.com/ws/ludo
      - key: VITE_WORDGRID_API_BASE_URL
        value: https://owg-wordgrid.onrender.com/api/v1/wordgrid
      - key: VITE_WORDGRID_WS_URL
        value: https://owg-wordgrid.onrender.com/ws/wordgrid
      - key: VITE_CONNECTDROP_API_BASE_URL
        value: https://owg-connectdrop.onrender.com/api/v1/connectdrop
      - key: VITE_CONNECTDROP_WS_URL
        value: https://owg-connectdrop.onrender.com/ws/connectdrop

  # ========================================================
  # 01. GAMES MASTER SERVICE (Port 8081)
  # ========================================================
  - type: web
    name: owg-games-master
    runtime: java
    rootDir: backend
    buildCommand: chmod +x mvnw && ./mvnw clean package -DskipTests -pl common,games-master-service -am
    startCommand: java -Dserver.port=$PORT -jar games-master-service/target/games-master-service-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: DB_URL
        value: jdbc:postgresql://pg-341588eb-meta-write.d.aivencloud.com:23090/owg_master?sslmode=require
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        value: charming-mako-242712.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"

  # ========================================================
  # 02. USER MANAGEMENT SERVICE (Port 8082)
