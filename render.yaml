services:
  # ========================================================
  # 🌐 FRONTEND (React 19 + Vite Static Site - 100% Free)
  # ========================================================
  - type: web
    name: owg-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://owg-backend.onrender.com/api/v1
      - key: VITE_AUTH_API_BASE_URL
        value: https://owg-backend.onrender.com/api/v1/auth
      - key: VITE_TTT_API_BASE_URL
        value: https://owg-backend.onrender.com/api/v1/tictactoe
      - key: VITE_TTT_WS_URL
        value: https://owg-backend.onrender.com/ws/tictactoe
      - key: VITE_LUDO_API_BASE_URL
        value: https://owg-backend.onrender.com/api/v1/ludo
      - key: VITE_LUDO_WS_URL
        value: https://owg-backend.onrender.com/ws/ludo
      - key: VITE_WORDGRID_API_BASE_URL
        value: https://owg-backend.onrender.com/api/v1/wordgrid
      - key: VITE_WORDGRID_WS_URL
        value: https://owg-backend.onrender.com/ws/wordgrid
      - key: VITE_CONNECTDROP_API_BASE_URL
        value: https://owg-backend.onrender.com/api/v1/connectdrop
      - key: VITE_CONNECTDROP_WS_URL
        value: https://owg-backend.onrender.com/ws/connectdrop

  # ========================================================
  # ⚙️ UNIFIED BACKEND (All 6 Microservices in 1 Container - 100% Free)
  # ========================================================
  - type: web
    name: owg-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://pg-341588eb-meta-write.d.aivencloud.com:23090/owg_master?sslmode=require
      - key: DB_URL_MASTER
        value: jdbc:postgresql://pg-341588eb-meta-write.d.aivencloud.com:23090/owg_master?sslmode=require
      - key: DB_URL_USERS
        value: jdbc:postgresql://pg-341588eb-meta-write.d.aivencloud.com:23090/owg_users?sslmode=require
      - key: DB_URL_TICTACTOE
        value: jdbc:postgresql://pg-341588eb-meta-write.d.aivencloud.com:23090/owg_tictactoe?sslmode=require
      - key: DB_URL_LUDO
        value: jdbc:postgresql://pg-341588eb-meta-write.d.aivencloud.com:23090/owg_ludo?sslmode=require
      - key: DB_URL_WORDGRID
        value: jdbc:postgresql://pg-341588eb-meta-write.d.aivencloud.com:23090/owg_wordgrid?sslmode=require
      - key: DB_URL_CONNECTDROP
        value: jdbc:postgresql://pg-341588eb-meta-write.d.aivencloud.com:23090/owg_connectdrop?sslmode=require
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        value: charming-mako-242712.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"
